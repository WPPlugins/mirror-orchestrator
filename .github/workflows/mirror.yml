name: Mirror WordPress.org Plugins

on:
  schedule:
    # Off-peak minutes avoid GitHub Actions :00/:15/:30/:45 thundering-herd drops.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated plugin slugs to sync (optional override)"
        required: false
        default: ""
        type: string
      backfill_limit:
        description: "Max backfill slugs to include per run"
        required: false
        default: "25"
        type: string
      max_slugs:
        description: "Max total slugs to sync per run (0 = unlimited)"
        required: false
        default: "50"
        type: string
      max_tags:
        description: "Max missing SVN tags to export per plugin per run (0 = unlimited)"
        required: false
        default: "25"
        type: string
      dry_run:
        description: "Run in read-only dry-run mode without mutating GitHub or state/"
        required: false
        default: false
        type: boolean

concurrency:
  group: wpplugins-mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.run_discover.outputs.slugs }}
      shards: ${{ steps.run_discover.outputs.shards }}
      has_slugs: ${{ steps.run_discover.outputs.has_slugs }}
      next_global_rev: ${{ steps.run_discover.outputs.next_global_rev }}
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}

      - name: Run discovery
        id: run_discover
        run: |
          ARGS="--backfill-limit ${{ github.event.inputs.backfill_limit || '25' }} --max-slugs ${{ github.event.inputs.max_slugs || '50' }}"
          if [ -n "${{ github.event.inputs.slugs }}" ]; then
            ARGS="$ARGS --slugs ${{ github.event.inputs.slugs }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          deno task discover $ARGS

  sync:
    needs: discover
    if: needs.discover.outputs.has_slugs == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wpplugins/mirror-runner:latest
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.discover.outputs.shards) }}
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@v7

      - name: Sync shard (${{ strategy.job-index }})
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          TARGET_ORG: ${{ secrets.TARGET_ORG || 'WPPlugins' }}
          SHARD_SLUGS: ${{ toJson(matrix.shard) }}
        run: |
          ARGS="--max-tags ${{ github.event.inputs.max_tags || '25' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          deno run --allow-all src/sync-shard.ts $ARGS

  finalize:
    needs: [discover, sync]
    if: always() && needs.discover.result == 'success' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}

      - name: Update cursor state
        env:
          NEXT_REV: ${{ needs.discover.outputs.next_global_rev }}
          HAS_SLUGS: ${{ needs.discover.outputs.has_slugs }}
          SYNC_RESULT: ${{ needs.sync.result }}
          MANUAL_SLUGS: ${{ github.event.inputs.slugs }}
          BACKFILL_LIMIT: ${{ github.event.inputs.backfill_limit || '25' }}
        run: |
          git pull --rebase origin main
          if [ "$HAS_SLUGS" = "false" ] || [ "$SYNC_RESULT" = "success" ]; then
            deno eval '
              const cursorPath = "state/cursor.json";
              const cursor = JSON.parse(await Deno.readTextFile(cursorPath));
              const nextRev = Number(Deno.env.get("NEXT_REV") || 0);
              if (nextRev > cursor.last_global_rev) {
                cursor.last_global_rev = nextRev;
              }
              cursor.last_run_at = new Date().toISOString();
              await Deno.writeTextFile(cursorPath, JSON.stringify(cursor, null, 2) + "\n");

              const manualSlugs = (Deno.env.get("MANUAL_SLUGS") || "").trim();
              const backfillLimit = Number(Deno.env.get("BACKFILL_LIMIT") || 0);
              if (!manualSlugs && backfillLimit > 0) {
                const qPath = "state/backfill-queue.json";
                const queue = JSON.parse(await Deno.readTextFile(qPath));
                if (Array.isArray(queue) && queue.length > 0) {
                  await Deno.writeTextFile(qPath, JSON.stringify(queue.slice(backfillLimit), null, 2) + "\n");
                }
              }
            '
          else
            echo "Sync job did not succeed (result=$SYNC_RESULT); keeping last_global_rev unchanged."
          fi

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): update mirror cursor [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
